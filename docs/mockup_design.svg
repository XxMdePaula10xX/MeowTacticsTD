<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Trebuchet MS', Verdana, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a44"/>
      <stop offset="0.55" stop-color="#2d2156"/>
      <stop offset="1" stop-color="#1b1533"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="1" stop-color="#ffe79a"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e6c4"/>
      <stop offset="1" stop-color="#e7cf9f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#332a55"/>
      <stop offset="1" stop-color="#271f44"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c6b4d"/>
      <stop offset="1" stop-color="#2f5640"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ed27e"/>
      <stop offset="1" stop-color="#4caf63"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e9be6"/>
      <stop offset="1" stop-color="#3f78c8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="softsh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="1280" height="720" fill="url(#sky)"/>
  <circle cx="1140" cy="120" r="46" fill="url(#moon)" opacity="0.95"/>
  <g fill="#fff" opacity="0.8">
    <circle cx="220" cy="70" r="2"/><circle cx="360" cy="48" r="1.5"/><circle cx="520" cy="90" r="2"/>
    <circle cx="700" cy="55" r="1.5"/><circle cx="880" cy="80" r="2"/><circle cx="980" cy="45" r="1.5"/>
    <circle cx="300" cy="130" r="1.5"/><circle cx="640" cy="120" r="1.5"/><circle cx="1050" cy="200" r="1.5"/>
  </g>

  <!-- Área de jogo: grama -->
  <rect x="176" y="92" width="868" height="476" rx="18" fill="url(#grass)"/>
  <g fill="#356046" opacity="0.5">
    <ellipse cx="250" cy="520" rx="40" ry="14"/><ellipse cx="900" cy="150" rx="50" ry="16"/>
    <ellipse cx="600" cy="520" rx="60" ry="18"/><ellipse cx="980" cy="500" rx="36" ry="12"/>
  </g>

  <!-- Caminho -->
