<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Verdana, sans-serif">
  <!-- Fundo: cor sólida escura como no código (Camera background) -->
  <rect width="1280" height="720" fill="#1a1530"/>

  <!-- Caminho: linha simples (LineRenderer) -->
  <polyline points="120,200 760,200 760,320 380,320 380,460 1160,460"
    fill="none" stroke="#4d4066" stroke-width="34" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 12 slots: quadrados translúcidos -->
  <g fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.18">
    <rect x="225" y="250" width="44" height="44" rx="3"/>
    <rect x="405" y="250" width="44" height="44" rx="3"/>
    <rect x="585" y="250" width="44" height="44" rx="3"/>
    <rect x="675" y="250" width="44" height="44" rx="3"/>
    <rect x="855" y="250" width="44" height="44" rx="3"/>
    <rect x="975" y="250" width="44" height="44" rx="3"/>
    <rect x="225" y="380" width="44" height="44" rx="3"/>
    <rect x="500" y="380" width="44" height="44" rx="3"/>
    <rect x="585" y="380" width="44" height="44" rx="3"/>
    <rect x="760" y="380" width="44" height="44" rx="3"/>
    <rect x="900" y="380" width="44" height="44" rx="3"/>
    <rect x="1030" y="380" width="44" height="44" rx="3"/>
  </g>

  <!-- Gatos: círculos coloridos (placeholderColor) -->
  <circle cx="247" cy="272" r="22" fill="#2e2e38"/>
  <circle cx="607" cy="272" r="22" fill="#9966e6"/>
  <circle cx="897" cy="402" r="22" fill="#4c8ccc"/>
  <circle cx="522" cy="402" r="22" fill="#4cb399"/>
  <!-- range do sniper (anel fraco) -->
  <circle cx="897" cy="402" r="115" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Inimigos: círculos + barra de vida simples -->
  <g>
    <circle cx="520" cy="200" r="18" fill="#ccc7f2"/>
    <rect x="500" y="172" width="40" height="6" fill="#000"/><rect x="501" y="173" width="30" height="4" fill="#3ddc5a"/>
  </g>
  <g>
    <circle cx="760" cy="270" r="18" fill="#4cb3d9"/>
    <rect x="740" y="242" width="40" height="6" fill="#000"/><rect x="741" y="243" width="28" height="4" fill="#3ddc5a"/>
  </g>
  <g>
    <circle cx="470" cy="320" r="18" fill="#7350a6"/>
    <rect x="450" y="292" width="40" height="6" fill="#000"/><rect x="451" y="293" width="20" height="4" fill="#dcc83a"/>
  </g>
  <!-- Boss: círculo grande -->
  <g>
    <circle cx="660" cy="460" r="40" fill="#5a1a73"/>
    <rect x="616" y="408" width="88" height="8" fill="#000"/><rect x="617" y="409" width="60" height="6" fill="#dc4a4a"/>
  </g>

  <!-- HUD topo: barra escura plana + texto simples -->
  <rect x="0" y="0" width="1280" height="60" fill="#1f1a33" fill-opacity="0.92"/>
  <text x="24" y="38" font-size="24" fill="#ffd24a" font-weight="bold">Meow Tactics TD</text>
  <text x="560" y="38" font-size="22" fill="#ffffff">Onda 6/10</text>
  <text x="940" y="38" font-size="22" fill="#cc6666">Vidas: 18</text>
  <text x="1110" y="38" font-size="22" fill="#ffd24a">Moedas: 24</text>

  <!-- Painel sinergias (direita): plano -->
  <rect x="1090" y="60" width="190" height="380" fill="#2c2647" fill-opacity="0.95"/>
  <text x="1185" y="92" font-size="20" fill="#ffd24a" font-weight="bold" text-anchor="middle">SINERGIAS</text>
  <text x="1108" y="132" font-size="20" fill="#b35a5a" font-weight="bold">Ninja  3 ✓</text>
  <text x="1108" y="170" font-size="20" fill="#5a8cd9" font-weight="bold">Sniper  2 ✓</text>
  <text x="1108" y="208" font-size="20" fill="#9966e6" font-weight="bold">Místico  2 ✓</text>

  <!-- Painel itens (esquerda): plano -->
  <rect x="0" y="60" width="150" height="380" fill="#2c2647" fill-opacity="0.95"/>
  <text x="75" y="92" font-size="18" fill="#ffd24a" font-weight="bold" text-anchor="middle">ITENS</text>
  <rect x="14" y="108" width="122" height="56" fill="#b3884a"/>
  <text x="75" y="142" font-size="14" fill="#fff" text-anchor="middle">Garra Afiada</text>
  <rect x="14" y="174" width="122" height="56" fill="#4c70b3"/>
  <text x="75" y="200" font-size="13" fill="#fff" text-anchor="middle">Distintivo</text>
  <text x="75" y="216" font-size="13" fill="#fff" text-anchor="middle">Sniper</text>

  <!-- Barra inferior: plana -->
  <rect x="0" y="540" width="1280" height="180" fill="#1f1a33" fill-opacity="0.95"/>
  <!-- loja -->
  <g font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">
    <rect x="20" y="554" width="150" height="70" fill="#3a2e2e"/><text x="95" y="582">Gato Ninja</text><text x="95" y="602">Custo 2</text>
    <rect x="180" y="554" width="150" height="70" fill="#2e3a4a"/><text x="255" y="582">Gato Sniper</text><text x="255" y="602">Custo 3</text>
    <rect x="340" y="554" width="150" height="70" fill="#3a2e4a"/><text x="415" y="582">Gato Mago</text><text x="415" y="602">Custo 3</text>
    <rect x="500" y="554" width="150" height="70" fill="#2e4a37"/><text x="575" y="582">Gato Arqueiro</text><text x="575" y="602">Custo 2</text>
    <rect x="660" y="554" width="150" height="70" fill="#2e4a44"/><text x="735" y="582">Gato Xamã</text><text x="735" y="602">Custo 3</text>
    <rect x="824" y="554" width="96" height="70" fill="#3f78c8"/><text x="872" y="582">Atualizar</text><text x="872" y="602">2 moedas</text>
  </g>
  <!-- banco -->
  <text x="24" y="676" font-size="16" fill="#b3884a" font-weight="bold">BANCO:</text>
  <g fill="#15112a" stroke="#3a3060">
    <rect x="110" y="652" width="44" height="36"/><rect x="162" y="652" width="44" height="36"/>
    <rect x="214" y="652" width="44" height="36"/><rect x="266" y="652" width="44" height="36"/>
    <rect x="318" y="652" width="44" height="36"/>
  </g>
  <circle cx="184" cy="670" r="13" fill="#9966e6"/>
  <!-- start wave -->
  <rect x="1050" y="554" width="210" height="140" fill="#4caf63"/>
  <text x="1155" y="612" font-size="22" fill="#0e3a18" font-weight="bold" text-anchor="middle">INICIAR</text>
  <text x="1155" y="644" font-size="22" fill="#0e3a18" font-weight="bold" text-anchor="middle">ONDA &gt;</text>

  <!-- selo -->
  <text x="160" y="510" font-size="15" fill="#888" font-style="italic">(versão atual no Unity — formas placeholder, sem arte ainda)</text>
</svg>
