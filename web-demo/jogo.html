<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meow Tactics TD — Demo Jogável</title>
<style>
  html,body{margin:0;background:#100c22;font-family:'Trebuchet MS',Verdana,sans-serif;color:#eee;
    display:flex;flex-direction:column;align-items:center;}
  h1{color:#ffd24a;font-size:20px;margin:8px;}
  #wrap{position:relative;max-width:98vw;}
  canvas{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,.6);}
  #bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px;}
  button{background:#5bbf6a;color:#0e3a18;border:none;padding:12px 18px;border-radius:12px;
    font-weight:bold;font-size:16px;cursor:pointer;transition:transform .05s;}
  button:active{transform:translateY(2px);}
  button.blue{background:#4f8bd8;color:#fff;}
  button:disabled{background:#555;color:#999;cursor:default;}
  #hint{color:#bba;font-size:13px;margin:2px;height:16px;}
</style>
</head>
<body>
  <h1>🐱 Meow Tactics TD — Demo Jogável</h1>
  <div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
  <div id="hint"></div>
  <div id="bar">
    <button id="buyBtn">🥷 Comprar Ninja (100)</button>
    <button id="waveBtn" class="blue">▶ Iniciar Onda</button>
  </div>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const CW=1280, CH=720, MAPW=1672, MAPH=941;
const SX=CW/MAPW, SY=CH/MAPH;
const hintEl=document.getElementById('hint');

// ---------- assets ----------
const mapImg=new Image(); mapImg.src='mapa_noturno.png';
const ninjaImg=new Image(); ninjaImg.src='gato_ninja.png';
let loaded=0; [mapImg,ninjaImg].forEach(im=>im.onload=()=>loaded++);

// ---------- caminho (escalado pro canvas) ----------
const PATH_PX=[[15,470],[360,470],[450,455],[452,238],[545,210],[612,220],[665,250],[745,272],
  [845,272],[915,245],[975,236],[1090,220],[1185,250],[1235,358],[1305,442],[1360,470],[1672,470]];
const PATH=PATH_PX.map(p=>({x:p[0]*SX,y:p[1]*SY}));
// comprimento acumulado
let SEG=[], TOTAL=0;
for(let i=0;i<PATH.length-1;i++){
  const a=PATH[i],b=PATH[i+1], len=Math.hypot(b.x-a.x,b.y-a.y);
  SEG.push({a,b,len,start:TOTAL}); TOTAL+=len;
}
function pointAt(dist){ // posição ao longo do caminho
  if(dist<=0) return {x:PATH[0].x,y:PATH[0].y,ang:0};
  for(const s of SEG){
    if(dist<=s.start+s.len){
      const t=(dist-s.start)/s.len;
      return {x:s.a.x+(s.b.x-s.a.x)*t, y:s.a.y+(s.b.y-s.a.y)*t,
              ang:Math.atan2(s.b.y-s.a.y,s.b.x-s.a.x)};
    }
  }
  const last=PATH[PATH.length-1]; return {x:last.x,y:last.y,ang:0};
}
function distToPath(px,py){ // menor distância de um ponto à estrada
  let best=1e9;
  for(const s of SEG){
    const dx=s.b.x-s.a.x, dy=s.b.y-s.a.y, l2=dx*dx+dy*dy||1;
    let t=((px-s.a.x)*dx+(py-s.a.y)*dy)/l2; t=Math.max(0,Math.min(1,t));
    const cx=s.a.x+dx*t, cy=s.a.y+dy*t;
    best=Math.min(best,Math.hypot(px-cx,py-cy));
  }
  return best;
}
const smooth=(a,b,t)=>{t=Math.max(0,Math.min(1,t));t=t*t*(3-2*t);return a+(b-a)*t;};

// ---------- estado ----------
let coins=300, lives=20, wave=0, maxWaves=5;
let enemies=[], towers=[], shurikens=[], floats=[];
let spawnQueue=[], spawnTimer=0, waveActive=false;
let placing=false, mouse={x:0,y:0,valid:false};
let gameOver=false, win=false;

// ---------- inimigos ----------
function spawnWave(){
  if(waveActive||gameOver) return;
  wave++;
  const n=5+wave*3;
  const hp=28+wave*16;
  const spd=58+wave*6;
  spawnQueue=[];
  for(let i=0;i<n;i++) spawnQueue.push({hp, spd, boss:false});
  if(wave===maxWaves) spawnQueue.push({hp:hp*14, spd:spd*0.55, boss:true});
  spawnTimer=0; waveActive=true;
  updateButtons();
}
function makeEnemy(spec){
  return {dist:0, hp:spec.hp, max:spec.hp, spd:spec.spd, boss:spec.boss,
          r:spec.boss?42:20, hit:0, shake:0, dead:false, reached:false};
}

// ---------- desenho de fantasma ----------
function drawGhost(e){
  const p=pointAt(e.dist); const x=p.x+(e.shake||0), y=p.y;
  ctx.save();
  ctx.fillStyle = e.hit>0 ? '#ffffff' : (e.boss?'#6a3da0':'#cfc6ee');
  ctx.beginPath();
  ctx.arc(x,y-e.r*0.3,e.r,Math.PI,0);
  ctx.lineTo(x+e.r,y+e.r*0.55);
  const step=e.r*0.4;
  for(let i=e.r;i>-e.r;i-=step) ctx.quadraticCurveTo(x+i-step/2,y+e.r*0.85,x+i-step,y+e.r*0.55);
  ctx.lineTo(x-e.r,y-e.r*0.3); ctx.fill();
  // olhos
  ctx.fillStyle = e.boss?'#ffd24a':'#2a2140';
  ctx.beginPath(); ctx.ellipse(x-e.r*0.4,y-e.r*0.25,e.r*0.13,e.r*0.18,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+e.r*0.4,y-e.r*0.25,e.r*0.13,e.r*0.18,0,0,7); ctx.fill();
  if(e.boss){ // coroa
    ctx.fillStyle='#ffd24a';
    ctx.beginPath(); ctx.moveTo(x-e.r*0.7,y-e.r*0.9); ctx.lineTo(x-e.r*0.7,y-e.r*1.3);
    ctx.lineTo(x-e.r*0.25,y-e.r*1.0); ctx.lineTo(x,y-e.r*1.45); ctx.lineTo(x+e.r*0.25,y-e.r*1.0);
    ctx.lineTo(x+e.r*0.7,y-e.r*1.3); ctx.lineTo(x+e.r*0.7,y-e.r*0.9); ctx.fill();
  }
  // barra de vida
  const bw=e.r*2.2, ratio=Math.max(0,e.hp/e.max);
  ctx.fillStyle='#000'; ctx.fillRect(x-bw/2,y-e.r*1.55,bw,6);
  ctx.fillStyle = ratio>0.4?'#6ed27e':'#d85a5a'; ctx.fillRect(x-bw/2+1,y-e.r*1.55+1,(bw-2)*ratio,4);
  ctx.restore();
}

// ---------- torre (ninja) ----------
function placeTower(x,y){
  towers.push({x,y,range:150,dmg:12,interval:1/1.4,cd:0,bob:Math.random()*6,atk:0,face:1});
}
function drawNinja(t){
  if(loaded<2) return;
  const baseH=120, baseW=ninjaImg.width*(baseH/ninjaImg.height);
  const bob=Math.sin(t.bob*6)*4;
  let sx=1+Math.sin(t.bob*6)*0.02, sy=1/sx, dx=0, ang=0;
  if(t.atk>0){ const p=1-t.atk/0.3;
    if(p<0.4){const k=p/0.4; sy=smooth(sy,0.85,k); sx=smooth(sx,1.15,k); dx=smooth(0,-6,k)*t.face;}
    else{const k=(p-0.4)/0.6; sy=smooth(0.85,1,k); sx=smooth(1.15,1,k); dx=smooth(-6,10,k)*t.face;}
  }
  ctx.save();
  ctx.translate(t.x+dx, t.y+bob);
  ctx.scale(t.face*sx, sy);
  ctx.drawImage(ninjaImg, -baseW/2, -baseH, baseW, baseH);
  ctx.restore();
}
function drawShuriken(s){
  ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.spin);
  ctx.fillStyle='#46464f'; ctx.strokeStyle='#14141c'; ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<8;i++){const r=i%2?5:13,a=i*Math.PI/4;const px=r*Math.cos(a),py=r*Math.sin(a);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

// ---------- HUD ----------
function panel(x,y,w,h){ ctx.fillStyle='rgba(20,16,40,0.8)'; roundRect(x,y,w,h,10); ctx.fill(); }
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawHUD(){
  panel(12,12,520,52);
  ctx.font='bold 26px Trebuchet MS'; ctx.textBaseline='middle';
  ctx.fillStyle='#ffd24a'; ctx.fillText('Moedas: '+coins, 28,38);
  ctx.fillStyle='#ff7a7a'; ctx.fillText('Vidas: '+lives, 245,38);
  ctx.fillStyle='#fff'; ctx.fillText('Onda '+wave+'/'+maxWaves, 400,38);
  // floats
  floats.forEach(f=>{ctx.globalAlpha=Math.max(0,f.life);ctx.fillStyle=f.color;
    ctx.font='bold 20px Trebuchet MS';ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;});
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!gameOver) update(dt);
  draw();
  requestAnimationFrame(frame);
}
function update(dt){
  // spawn
  if(waveActive){
    spawnTimer-=dt;
    if(spawnTimer<=0 && spawnQueue.length){ enemies.push(makeEnemy(spawnQueue.shift())); spawnTimer=0.65; }
  }
  // inimigos
  for(const e of enemies){
    e.dist+=e.spd*dt;
    if(e.hit>0) e.hit-=dt*4;
    if(e.dist>=TOTAL){ e.reached=true; e.dead=true; lives-=e.boss?5:1;
      addFloat(CW-120,80,'-'+(e.boss?5:1),'#ff6a6a');
      if(lives<=0){lives=0;gameOver=true;win=false;} }
  }
  // torres atacam
  for(const t of towers){
    t.bob+=dt; if(t.atk>0) t.atk-=dt; t.cd-=dt;
    // alvo: inimigo mais à frente no alcance
    let target=null, bestDist=-1;
    for(const e of enemies){ if(e.dead) continue;
      const p=pointAt(e.dist); if(Math.hypot(p.x-t.x,p.y-t.y)<=t.range && e.dist>bestDist){bestDist=e.dist;target=e;} }
    if(target){
      const p=pointAt(target.dist); t.face = p.x>=t.x?1:-1;
      if(t.cd<=0){ t.cd=t.interval; t.atk=0.3;
        shurikens.push({x:t.x,y:t.y-50,target,dmg:t.dmg,spin:0}); }
    }
  }
  // shurikens
  for(const s of shurikens){
    s.spin+=dt*20;
    const tp = s.target.dead ? {x:s.x+ (s.lastdx||40), y:s.y} : pointAt(s.target.dist);
    const dx=tp.x-s.x, dy=tp.y-s.y, d=Math.hypot(dx,dy);
    const v=620*dt;
    if(d<=v){ // acerta
      if(!s.target.dead){ s.target.hp-=s.dmg; s.target.hit=1; s.target.shake=(Math.random()<.5?-4:4);
        if(s.target.hp<=0){ s.target.dead=true; coins+=8; addFloat(tp.x,tp.y,'+8','#ffd24a'); } }
      s.done=true;
    } else { s.x+=dx/d*v; s.y+=dy/d*v; s.lastdx=dx/d*40; }
  }
  // floats
  for(const f of floats){ f.y-=20*dt; f.life-=dt; }
  // limpeza
  enemies=enemies.filter(e=>!e.dead);
  shurikens=shurikens.filter(s=>!s.done);
  floats=floats.filter(f=>f.life>0);
  for(const e of enemies) if(e.shake) e.shake*=0.8;
  // fim de onda
  if(waveActive && spawnQueue.length===0 && enemies.length===0){
    waveActive=false; coins+=30+wave*10; addFloat(CW/2,90,'+'+(30+wave*10)+' moedas','#ffd24a');
    if(wave>=maxWaves){ gameOver=true; win=true; }
    updateButtons();
  }
}
function addFloat(x,y,txt,color){ floats.push({x,y,txt,color,life:1.0}); }

function draw(){
  if(loaded<1){ ctx.fillStyle='#100c22'; ctx.fillRect(0,0,CW,CH); return; }
  ctx.drawImage(mapImg,0,0,CW,CH);
  // alcance no modo de posicionamento
  if(placing){
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,150,0,7);
    ctx.fillStyle=mouse.valid?'rgba(110,210,126,0.18)':'rgba(216,90,90,0.18)';
    ctx.fill(); ctx.strokeStyle=mouse.valid?'#6ed27e':'#d85a5a'; ctx.lineWidth=2; ctx.stroke();
  }
  // ordena por y pra profundidade
  const drawables=[...enemies.map(e=>({y:pointAt(e.dist).y,f:()=>drawGhost(e)})),
                   ...towers.map(t=>({y:t.y,f:()=>drawNinja(t)}))];
  drawables.sort((a,b)=>a.y-b.y).forEach(d=>d.f());
  shurikens.forEach(drawShuriken);
  if(placing && loaded>=2){ // prévia do ninja no cursor
    ctx.globalAlpha=0.6;
    const baseH=120, baseW=ninjaImg.width*(baseH/ninjaImg.height);
    ctx.drawImage(ninjaImg,mouse.x-baseW/2,mouse.y-baseH,baseW,baseH); ctx.globalAlpha=1;
  }
  drawHUD();
  if(gameOver) drawEnd();
}
function drawEnd(){
  ctx.fillStyle='rgba(0,0,0,0.78)'; ctx.fillRect(0,0,CW,CH);
  ctx.textAlign='center';
  ctx.fillStyle=win?'#ffd24a':'#ff7a7a'; ctx.font='bold 64px Trebuchet MS';
  ctx.fillText(win?'VITÓRIA! 🎉':'DERROTA', CW/2, CH/2-40);
  ctx.fillStyle='#fff'; ctx.font='26px Trebuchet MS';
  ctx.fillText(win?'Você defendeu a base dos pesadelos!':'Os pesadelos invadiram a base...', CW/2, CH/2+20);
  ctx.fillText('Atualize a página (F5) para jogar de novo', CW/2, CH/2+60);
  ctx.textAlign='left';
}

// ---------- input ----------
function canvasPos(ev){
  const r=cv.getBoundingClientRect();
  const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
  const cy=(ev.touches?ev.touches[0].clientY:ev.clientY)-r.top;
  return {x:cx*(CW/r.width), y:cy*(CH/r.height)};
}
function validSpot(x,y){
  if(x<60||x>CW-60||y<90||y>CH-30) return false;
  if(distToPath(x,y)<46) return false;
  for(const t of towers) if(Math.hypot(t.x-x,t.y-y)<60) return false;
  return true;
}
cv.addEventListener('mousemove',ev=>{const p=canvasPos(ev);mouse.x=p.x;mouse.y=p.y;mouse.valid=validSpot(p.x,p.y);});
cv.addEventListener('click',ev=>{
  if(!placing||gameOver) return;
  const p=canvasPos(ev);
  if(validSpot(p.x,p.y) && coins>=100){ placeTower(p.x,p.y); coins-=100; placing=false; setHint(''); updateButtons(); }
  else if(coins<100){ setHint('Moedas insuficientes!'); }
  else { setHint('Lugar inválido — não pode em cima da estrada nem de outro gato.'); }
});

// ---------- botões ----------
const buyBtn=document.getElementById('buyBtn'), waveBtn=document.getElementById('waveBtn');
buyBtn.onclick=()=>{ if(gameOver) return;
  if(coins<100){ setHint('Moedas insuficientes!'); return; }
  placing=!placing; setHint(placing?'Clique numa área roxa (fora da estrada) para posicionar o ninja.':''); };
waveBtn.onclick=()=>{ if(!waveActive && !gameOver) spawnWave(); };
function updateButtons(){
  waveBtn.disabled = waveActive || gameOver;
  buyBtn.disabled = gameOver;
  buyBtn.textContent = '🥷 Comprar Ninja (100)';
}
function setHint(t){ hintEl.textContent=t; }

requestAnimationFrame(frame);
updateButtons();
setHint('Compre um Ninja, posicione perto da estrada e inicie a onda!');
</script>
</body>
</html>
