# Codemagic CI/CD — build iOS do Meow Tactics (Capacitor) e envio ao TestFlight.
# Requisitos (no painel do Codemagic / App Store Connect):
#   1. Integração App Store Connect API key com o nome "quantum_asc" (Key 4UQMCZZJ95).
#   2. Um app criado no App Store Connect com o Bundle ID com.meowtactics.td (App ID registrado).
#   3. A API key com papel "App Manager" ou "Admin".
# Team ID: 249VTHN4GQ
#
# Assinatura MANUAL: "app-store-connect fetch-signing-files --create" CRIA o
# certificado + provisioning profile (o bloco automático ios_signing só busca
# existentes e falhava com "no matching profiles"). Depois um passo força o
# bundle id do target e "xcode-project use-profiles" aplica ao projeto.
workflows:
  ios-testflight:
    name: Meow Tactics — iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: quantum_asc
    environment:
      groups:
        - meowtactics_signing   # contém CERT_KEY_B64 (chave privada fixa, base64, secure)
      vars:
        BUNDLE_ID: "com.meowtactics.td"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependências (Capacitor)
        script: |
          cd web
          npm install
      - name: Montar a pasta web (www) — bundle único comprimido (~2.3MB)
        script: |
          cd web
          rm -rf www && mkdir www
          # www = só o dist auto-contido (HTML+CSS+JS+assets em base64/JPEG),
          # commitado no repo. Evita copiar os 36MB de assets crus pro .ipa.
          cp dist/meow-tactics.html www/index.html
          echo "Tamanho do www:"; du -sh www; ls -la www
          # trava de segurança: aborta se o www passar de 6MB (bloat voltou)
          SZ=$(du -sm www | cut -f1); if [ "$SZ" -gt 6 ]; then echo "www muito grande (${SZ}MB) — abortando"; exit 1; fi
      - name: Adicionar/sincronizar plataforma iOS
        script: |
          cd web
          npx cap add ios
          npx cap sync ios
      - name: Garantir o Bundle ID no projeto Xcode
        script: |
          cd web/ios/App
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" App.xcodeproj/project.pbxproj
          echo "Bundle IDs no projeto:"; grep PRODUCT_BUNDLE_IDENTIFIER App.xcodeproj/project.pbxproj
      - name: Gerar ícone e splash a partir de resources/
        script: |
          cd web
          npx @capacitor/assets generate --assetPath resources --ios \
            --iconBackgroundColor '#0f1020' --splashBackgroundColor '#0f1020' || true
      - name: Travar orientação em paisagem (landscape)
        script: |
          cd web/ios/App/App
          plutil -replace UISupportedInterfaceOrientations -json \
            '["UIInterfaceOrientationLandscapeLeft","UIInterfaceOrientationLandscapeRight"]' Info.plist
          plutil -replace "UISupportedInterfaceOrientations~ipad" -json \
            '["UIInterfaceOrientationLandscapeLeft","UIInterfaceOrientationLandscapeRight"]' Info.plist || true
          # A Apple exige as 4 orientações no iPad SE o app entra no multitarefa.
          # Como o jogo é só paisagem, optamos por tela cheia (sai do multitarefa)
          # e o landscape-only passa a ser válido — corrige o erro 90474 no upload.
          plutil -replace UIRequiresFullScreen -bool true Info.plist
      - name: Definir número do build
        script: |
          cd web/ios/App
          agvtool new-version -all "${BUILD_NUMBER:-1}"
      - name: Assinar e compilar (.ipa)   # tudo numa etapa — o log traz o --verbose junto do erro
        script: |
          set -e
          echo "===== 0) CHAVE PRIVADA DO CERTIFICADO (FIXA) ====="
          # A Apple guarda o certificado mas NUNCA a chave privada — a chave é nossa.
          # Se a chave for gerada nova a cada build, nenhum cert existente "casa" com
          # ela e o --create tenta criar outro -> estoura o limite (409). A solução é
          # usar UMA chave fixa (env CERT_KEY_B64, base64) reaproveitada em todo build.
          CERT_KEY="$CM_BUILD_DIR/cert_private_key.pem"
          if [ -n "$CERT_KEY_B64" ]; then
            echo "$CERT_KEY_B64" | base64 --decode > "$CERT_KEY"
            echo "Usando chave privada FIXA do env CERT_KEY_B64 (reaproveita o certificado)."
          else
            openssl genrsa -out "$CERT_KEY" 2048
            echo "AVISO: CERT_KEY_B64 ausente — gerei chave nova. Adicione CERT_KEY_B64 no"
            echo "Codemagic p/ reaproveitar o mesmo certificado nos próximos builds."
          fi
          echo "===== 1) FETCH SIGNING FILES (verbose) ====="
          keychain initialize
          fetch_signing() {
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --certificate-key @file:"$CERT_KEY" \
              --create --verbose
          }
          if ! fetch_signing; then
            echo "===== 1b) CREATE FALHOU — REVOGANDO CERTS DE DISTRIBUIÇÃO INCOMPATÍVEIS ====="
            # Os certs existentes não têm a nossa chave privada e bloqueiam o --create (409).
            # Como são inúteis pra nós (sem chave) e a conta é dedicada a este app, revogamos
            # e recriamos UM com a chave fixa — que passa a ser reaproveitado em todo build.
            app-store-connect certificates list --json 2>/dev/null > /tmp/certs.json || true
            echo "Certificados encontrados na conta:"
            python3 -c "import json;d=json.load(open('/tmp/certs.json'));it=d if isinstance(d,list) else d.get('data',[]);[print(' -',c.get('id'),c.get('attributes',{}).get('certificateType'),c.get('attributes',{}).get('serialNumber')) for c in it]" 2>/dev/null || echo "  (lista vazia ou ilegível)"
            IDS=$(python3 -c "import json;d=json.load(open('/tmp/certs.json'));it=d if isinstance(d,list) else d.get('data',[]);print(chr(10).join(c['id'] for c in it if c.get('id') and 'DISTRIBUTION' in str(c.get('attributes',{}).get('certificateType','')).upper()))" 2>/dev/null || true)
            for cid in $IDS; do
              echo "Revogando certificado de distribuição: $cid"
              app-store-connect certificates delete "$cid" --yes 2>/dev/null \
                || yes | app-store-connect certificates delete "$cid" 2>/dev/null \
                || echo "  (falha ao revogar $cid — revogue manualmente no portal da Apple)"
            done
            echo "===== 1c) RECRIANDO ASSINATURA COM A CHAVE FIXA ====="
            fetch_signing
          fi
          echo "===== 2) PROCURA .mobileprovision NO SISTEMA ====="
          find "$CM_BUILD_DIR" "$HOME" -name "*.mobileprovision" 2>/dev/null || true
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          find "$CM_BUILD_DIR" "$HOME" -name "*.mobileprovision" 2>/dev/null -exec cp -n {} "$HOME/Library/MobileDevice/Provisioning Profiles/" \; 2>/dev/null || true
          echo "===== 3) PERFIS INSTALADOS ====="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"
          echo "===== 4) ADD CERTIFICATES ====="
          keychain add-certificates
          echo "===== 5) USE-PROFILES ====="
          xcode-project use-profiles
          echo "===== 6) SETTINGS DE ASSINATURA ====="
          cd web
          xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" -showBuildSettings 2>/dev/null \
            | grep -iE "CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY" | sort -u
          echo "===== 7) BUILD IPA / ARCHIVE ====="
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - web/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - web/ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
